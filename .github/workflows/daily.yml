name: Daily Video

on:
  workflow_dispatch:            # manual run — pick the part
    inputs:
      part:
        description: "Which part (1 = morning, 2 = evening)"
        type: choice
        options: ["1", "2"]
        default: "1"
  schedule:
    - cron: "30 3 * * *"        # 03:30 UTC = 09:00 IST -> Part 1 (morning)
    - cron: "30 15 * * *"       # 15:30 UTC = 21:00 IST -> Part 2 (evening)

concurrency:
  group: daily-video-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg + fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python deps
        run: pip install edge-tts requests numpy Pillow

      - name: Generate the video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          VIDEO_PART: ${{ github.event.inputs.part }}   # empty on schedule -> derived from time
        run: python dve.py

      - name: Upload the finished video (only the final file)
        uses: actions/upload-artifact@v4
        with:
          name: daily-video
          path: output/*/video_*.mp4
          retention-days: 7
