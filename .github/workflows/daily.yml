name: Daily Video

on:
  workflow_dispatch:
    inputs:
      part:
        description: "Which part (1 = morning, 2 = evening)"
        type: choice
        options: ["1", "2"]
        default: "1"
  schedule:
    - cron: "30 3 * * *"
    - cron: "30 15 * * *"

concurrency:
  group: daily-video-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg + fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python deps
        run: pip install edge-tts requests numpy Pillow google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Generate the video + auto-post to YouTube
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          VIDEO_PART: ${{ github.event.inputs.part }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python dve.py

      - name: Upload the finished video (only the final file)
        uses: actions/upload-artifact@v4
        with:
          name: daily-video
          path: output/*/video_*.mp4
          retention-days: 7
