name: Daily Video

on:
  workflow_dispatch:        # lets you run it on demand from the Actions tab
  schedule:
    - cron: "30 4 * * *"    # 04:30 UTC daily (= 10:00 IST). Adjust anytime.

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg + fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python deps
        run: pip install edge-tts requests numpy Pillow

      - name: Generate the video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python dve.py

      - name: Upload the video (download it from here)
        uses: actions/upload-artifact@v4
        with:
          name: daily-video
          path: output/**/*.mp4
          retention-days: 7
